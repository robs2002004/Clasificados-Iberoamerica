name: Desplegar Cloud Functions a Firebase

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: functions
        run: npm install

      - name: Desplegar a Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: clasificados-iberoamerica

# ============================================================
# CÓMO CONECTAR ESTO A TU REPO DE GITHUB
# ============================================================
# 1. En Firebase Console → ⚙️ Configuración del proyecto → Cuentas de
#    servicio → "Generar nueva clave privada". Descarga un archivo .json.
#
# 2. En tu repo de GitHub → Settings → Secrets and variables → Actions →
#    "New repository secret":
#      Nombre: FIREBASE_SERVICE_ACCOUNT
#      Valor:  pegá TODO el contenido del .json descargado en el paso 1
#
# 3. Los secrets de PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET NO van acá:
#    esos se configuran una sola vez desde tu compu con
#    "firebase functions:secrets:set" (ver instrucciones al final de
#    functions/index.js). GitHub Actions solo necesita permiso para
#    desplegar, no las claves de PayPal.
#
# 4. Cada vez que hagas push a "main" tocando algo dentro de functions/,
#    esta Action va a desplegar automáticamente. También podés desplegar
#    a mano en cualquier momento con: firebase deploy --only functions
# ============================================================
