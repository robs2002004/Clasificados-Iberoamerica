<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago cancelado — Clasificados Iberoamérica</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1b1e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #142a2e;
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p { color: #b8c4c6; line-height: 1.5; margin-bottom: 20px; }
  .btn {
    display: inline-block;
    margin-top: 10px;
    padding: 12px 28px;
    background: #ff8a00;
    color: #0d1b1e;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="card">
  <div class="icon">✖️</div>
  <h1>Pago cancelado</h1>
  <p>No se realizó ningún cobro. Tu anuncio quedó guardado pero no se publicará hasta que completes el pago.</p>
  <a class="btn" href="./">Volver al inicio</a>
</div>

</body>
</html>
